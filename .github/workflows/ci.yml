name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI Pipeline (Audit, Gitleaks, Lint, Typecheck, Test, Build, Docker)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_code_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Step 1: Install
      - name: Install Dependencies
        run: npm ci

      # Step 2: Secret Scanning with Gitleaks (Item 24)
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Production Dependency Audit (Item 24)
      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=critical

      # Step 4: Verify No .env Files Tracked (Item 26)
      - name: Verify No Tracked .env Files
        run: npm run check:env-tracked

      # Step 5: Prisma Generate
      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_code_review?schema=public

      # Step 6: Deploy Database Migrations to Service Postgres (Item 24)
      - name: Deploy Database Migrations
        run: npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_code_review?schema=public

      # Step 7: Build Internal Packages
      - name: Build Internal Packages
        run: npm run build:packages
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_code_review?schema=public

      # Step 8: Lint
      - name: Run ESLint
        run: npm run lint

      # Step 9: Typecheck
      - name: Run Typecheck
        run: npm run typecheck

      # Step 10: Test (Node test runner strictly exits non-zero on failure)
      - name: Run Unit & Integration Tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_code_review?schema=public
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: ci-testing-secret-key-32-chars-minimum

      # Step 10b: Security Regression Suite (Phase 5 Matrix)
      - name: Run Security Regression Suite
        run: npm run test:security
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_code_review?schema=public
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: ci-testing-secret-key-32-chars-minimum

      # Step 11: Build Application Workspaces
      - name: Build All Workspaces
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_code_review?schema=public
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: ci-testing-secret-key-32-chars-minimum

      # Step 12: Docker Build (Item 24)
      - name: Build Docker Images
        run: docker compose build
